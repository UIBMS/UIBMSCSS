name: Build border profiles
on:
  push:
    branches: ['feature/border-profiles']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix tools install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools run build
      - run: npm --prefix website install --no-audit --no-fund
      - run: npm --prefix website run check:content
      - run: npm --prefix website run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate border profile distributions"
            git push origin HEAD:feature/border-profiles
          fi
