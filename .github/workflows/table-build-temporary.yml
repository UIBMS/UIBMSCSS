name: Rebuild responsive table distributions
on:
  push:
    branches: ['fix/responsive-native-tables-build']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix tools install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools run build
      - name: Commit generated distributions to this build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate framework distributions for responsive tables"
            git push origin HEAD:fix/responsive-native-tables-build
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: |
          for browser in chromium firefox webkit; do
            python tests/tables.py --browser "$browser"
          done
