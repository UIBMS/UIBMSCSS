name: Deploy UIBMS CSS Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'extensions/engines/**'
      - 'tests/engines.mjs'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /UIBMSCSS/
      SITE_PUBLIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        working-directory: website
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify optional engine primitives
        run: node tests/engines.mjs
      - name: Verify content and framework integrity
        working-directory: website
        run: npm run check:content
      - name: Build Astro website
        working-directory: website
        run: npm run build
      - name: Verify generated static website
        working-directory: website
        run: node tools/check-build.mjs
      - name: Install browser regression test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify material profile integration in Chromium
        run: python website/tests/material-review.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
